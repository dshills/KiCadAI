name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  offline-static:
    name: Offline static and contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KICADAI_EXAMPLE_TEST_TIMEOUT: 3m
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: ./scripts/check-go-format.sh
        env:
          KICADAI_FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m ./...

      - name: Verify clean-checkout promotion contract
        timeout-minutes: 10
        run: go test -timeout 9m ./internal/promotionrunner -run '^(TestCleanCheckoutPromotionCommandContract|TestPromotionWorkflowContractAndPinnedActions)$'

      # The frozen V8 runner manifest was authored on a case-insensitive
      # filesystem with two uppercase path spellings. Materialize temporary
      # aliases only for that historical verification, then restore the exact
      # 25-file corpus before the broad suite checks its sealed file set.
      - name: Verify legacy V8 round-one freeze
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          corpus=internal/capabilityfeedback/testdata/closed_loop_open_set_v8_corpus
          created=()
          ensure_alias() {
            local source=$1 target=$2
            if [[ ! -e "$target" ]]; then
              cp "$source" "$target"
              created+=("$target")
            fi
          }
          cleanup() {
            if (( ${#created[@]} )); then
              rm -f "${created[@]}"
            fi
          }
          trap cleanup EXIT
          ensure_alias "$corpus/manifest.json" "$corpus/MANIFEST.json"
          ensure_alias "$corpus/discovery_obligations.json" "$corpus/DISCOVERY_OBLIGATIONS.json"
          go test -short -timeout 9m ./internal/capabilityfeedback -run '^TestClosedLoopV8Round1'

  coverage-shard:
    name: Bounded coverage (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KICADAI_EXAMPLE_TEST_TIMEOUT: 3m
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: general-0-of-4
            group: general
            index: 0
            total: 4
          - name: general-1-of-4
            group: general
            index: 1
            total: 4
          - name: general-2-of-4
            group: general
            index: 2
            total: 4
          - name: general-3-of-4
            group: general
            index: 3
            total: 4
          - name: open-topology-0-of-6
            group: open-topology
            index: 0
            total: 6
          - name: open-topology-1-of-6
            group: open-topology
            index: 1
            total: 6
          - name: open-topology-2-of-6
            group: open-topology
            index: 2
            total: 6
          - name: open-topology-3-of-6
            group: open-topology
            index: 3
            total: 6
          - name: open-topology-4-of-6
            group: open-topology
            index: 4
            total: 6
          - name: open-topology-5-of-6
            group: open-topology
            index: 5
            total: 6
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fingerprint bounded proof inputs
        id: source
        shell: bash
        run: echo "fingerprint=$(./scripts/coverage-source-fingerprint.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore immutable coverage proof
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/coverage-proofs
          key: coverage-proof-v1-${{ runner.os }}-${{ matrix.name }}-${{ steps.source.outputs.fingerprint }}

      - name: Run bounded coverage shard
        run: |
          # Preserve the legacy prefix exclusion: the static lane above runs
          # this complete freeze-test family while its temporary aliases exist.
          make \
            GOCACHE_DIR="$(go env GOCACHE)" \
            GOMODCACHE_DIR="$(go env GOMODCACHE)" \
            GO_TEST_TIMEOUT=12m \
            COVER_TEST_SKIP='^TestClosedLoopV8Round1' \
            COVERAGE_SHARD_GROUP='${{ matrix.group }}' \
            COVERAGE_SHARD_INDEX='${{ matrix.index }}' \
            COVERAGE_SHARD_TOTAL='${{ matrix.total }}' \
            COVERAGE_SHARD_OUTPUT='.coverage/shards/${{ matrix.name }}' \
            coverage-shard

      - name: Upload authenticated coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.name }}
          path: .coverage/shards/${{ matrix.name }}
          if-no-files-found: error
          include-hidden-files: true

  offline-quality:
    name: Offline quality gates
    needs:
      - offline-static
      - coverage-shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download authenticated coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: .coverage/shards
          merge-multiple: false
          digest-mismatch: error

      - name: Verify exact selection, merge coverage, and enforce floor
        run: |
          # The merge must regenerate the same prefix-excluded inventory used
          # by every shard; those legacy freeze tests ran in offline-static.
          make \
            GOCACHE_DIR="$(go env GOCACHE)" \
            GOMODCACHE_DIR="$(go env GOMODCACHE)" \
            COVER_TEST_SKIP='^TestClosedLoopV8Round1' \
            coverage-merge-check

      - name: Report bounded resource and cache profile
        run: cat .coverage/profile.tsv

  offline-promotion:
    name: Offline promotion corpus (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      KICADAI_EXAMPLE_TEST_TIMEOUT: 3m
      KICADAI_PROMOTION_SHARD: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: open-set
            test: TestFrozenOpenSetCorpusPassesOfflineWorkflow
            shard: ''
            go_timeout: 40m
          - name: adversarial-multi-function
            test: TestFrozenAdversarialMultiFunctionCorpusPassesOfflineWorkflow
            shard: ''
            go_timeout: 40m
          - name: simulation-grounded-0-of-3
            test: TestFrozenSimulationGroundedCorpusPassesOfflineWorkflow
            shard: 0/3
            go_timeout: 55m
          - name: simulation-grounded-1-of-3
            test: TestFrozenSimulationGroundedCorpusPassesOfflineWorkflow
            shard: 1/3
            go_timeout: 55m
          - name: simulation-grounded-2-of-3
            test: TestFrozenSimulationGroundedCorpusPassesOfflineWorkflow
            shard: 2/3
            go_timeout: 55m
          - name: hierarchical-multi-domain-0-of-6
            test: TestHierarchicalMultiDomainCorpusPassesOfflineWorkflow
            shard: 0/6
            go_timeout: 55m
          - name: hierarchical-multi-domain-1-of-6
            test: TestHierarchicalMultiDomainCorpusPassesOfflineWorkflow
            shard: 1/6
            go_timeout: 55m
          - name: hierarchical-multi-domain-2-of-6
            test: TestHierarchicalMultiDomainCorpusPassesOfflineWorkflow
            shard: 2/6
            go_timeout: 55m
          - name: hierarchical-multi-domain-3-of-6
            test: TestHierarchicalMultiDomainCorpusPassesOfflineWorkflow
            shard: 3/6
            go_timeout: 55m
          - name: hierarchical-multi-domain-4-of-6
            test: TestHierarchicalMultiDomainCorpusPassesOfflineWorkflow
            shard: 4/6
            go_timeout: 55m
          - name: hierarchical-multi-domain-5-of-6
            test: TestHierarchicalMultiDomainCorpusPassesOfflineWorkflow
            shard: 5/6
            go_timeout: 55m
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run frozen promotion corpus
        run: make GO_TEST_TIMEOUT='${{ matrix.go_timeout }}' GO_TEST_PACKAGE=./internal/compositionlowering GO_TEST_NAME='${{ matrix.test }}' test-one

  external-review-matrix:
    name: External review regression ladder
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KICADAI_EXAMPLE_TEST_TIMEOUT: 3m
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run external review matrix twice
        run: make review-matrix
